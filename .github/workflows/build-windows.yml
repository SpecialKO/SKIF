name: Builds

on: [push, pull_request]

jobs:
  Build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]

    steps:
    - uses: actions/checkout@v4

    - uses: SpecialKO/GA-setup-cpp-n20@master

    - uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Restore the required Nuget packages
      run: |
        nuget restore SKIF.sln

    - name: Build the codebase (${{ matrix.platform }})
      run: |
        msbuild SKIF.sln -p:Configuration="Release" -p:Platform="${{ matrix.platform }}" -m

    # Per-platform artifacts; the Merge job combines them and then deletes these
    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: |
          Builds/SKIF*.exe
        if-no-files-found: error
        retention-days: 1

    - uses: actions/upload-artifact@v4
      with:
        name: symbols-${{ matrix.platform }}
        path: |
          Builds/SKIF*.pdb
        if-no-files-found: warn
        retention-days: 1

  Merge:
    name: Merge artifacts
    needs: Build
    runs-on: windows-2022

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: build-*
        path: Builds
        merge-multiple: true

    - uses: actions/download-artifact@v4
      with:
        pattern: symbols-*
        path: Symbols
        merge-multiple: true

    - name: Prepare environment variables for the artifact name
      id: prep
      run: |
        # Prefer the 64-bit SKIF.exe for the version, fall back to any SKIF*.exe
        $Exe = Get-Item ".\Builds\SKIF.exe", ".\Builds\SKIF*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        $Version = if ($Exe) { $Exe.VersionInfo.ProductVersion } else { $null }
        If ([string]::IsNullOrWhiteSpace($Version)) { $Version = "unknown" }
        "SKIF_VERSION=$($Version.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
        "SHORT_SHA=$("${{ github.sha }}".SubString(0, 8))" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

        $HasSymbols = [bool](Get-ChildItem ".\Symbols\*.pdb" -ErrorAction SilentlyContinue)
        "has_symbols=$($HasSymbols.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
        Get-ChildItem .\Builds, .\Symbols -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize

    - uses: actions/upload-artifact/merge@v4
      with:
        name: SKIF_${{ env.SKIF_VERSION }}_${{ env.SHORT_SHA }}
        pattern: build-*
        delete-merged: true

    - uses: actions/upload-artifact/merge@v4
      if: steps.prep.outputs.has_symbols == 'true'
      with:
        name: SKIF_${{ env.SKIF_VERSION }}_${{ env.SHORT_SHA }}_debug_symbols
        pattern: symbols-*
        delete-merged: true
